<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF7F4">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4Sprayers">
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
<title>4Sprayers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F4;
    --surface: #FFFFFF;
    --ink: #231F20;
    --ink-soft: #5E5856;
    --line: #EDDCCF;
    --accent: #8BC53E;
    --accent-hover: #9ECE5D;
    --accent-strong: #4E7A1E;
    --accent-soft: #EFF6E4;
    --wine: #9B3B2F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
  p { margin: 0; }
  a { color: var(--accent-strong); }
  /* 4Sprayers (14/10/2026): logo al centro, modulo e "Accedi" in basso, sotto il pollice. */
  .login-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 440px; margin: 0 auto; padding: 0 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .brand { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 48px 0 32px; text-align: center; }
  .logo { display: flex; align-items: baseline; gap: 6px; font-family: 'Montserrat', system-ui, sans-serif; }
  .logo-4 { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1; }
  .logo-name { font-size: 26px; font-weight: 600; letter-spacing: 0.32em; line-height: 1; margin-right: -0.32em; }
  .tagline { font-size: 15px; color: var(--ink-soft); }
  .form-card { display: flex; flex-direction: column; gap: 18px; }
  .field label { display: block; font-family: 'Montserrat', system-ui, sans-serif; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field input { width: 100%; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 17px; background: var(--surface); color: var(--ink); height: 54px; }
  .field input:focus { outline: 2px solid var(--accent-strong); outline-offset: 1px; border-color: var(--accent-strong); }
  .btn-primary { display: flex; align-items: center; justify-content: center; text-decoration: none; background: var(--accent); color: var(--ink); padding: 0 32px; border-radius: 100px; font-family: 'Montserrat', system-ui, sans-serif; font-size: 17px; font-weight: 700; min-height: 56px; }
  .btn-primary:hover { background: var(--accent-hover); color: var(--ink); }
  .btn-toggle { border: 0; background: transparent; color: var(--accent-strong); font-family: 'Montserrat', system-ui, sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; padding: 8px 4px; }
  .pw-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .pw-row label { margin-bottom: 0; }
  .help { font-size: 14px; color: var(--ink-soft); line-height: 1.45; }
  /* Adattamento a qualsiasi schermo: niente scorrimento orizzontale della pagina. */
  img, svg, video, canvas { max-width: 100%; }
  fieldset { min-width: 0; }
  input, select, textarea, button { max-width: 100%; }
  h1, h2, h3, h4, p, li, dd, dt, label, a, span, td, th { overflow-wrap: break-word; }
</style>
</helmet>

<div class="login-shell">
  <div class="brand">
    <div class="logo" role="img" aria-label="4Sprayers"><span class="logo-4">4</span><span class="logo-name">SPRAYERS</span></div>
    <p class="tagline">Verifica della taratura in vigneto</p>
  </div>

  <main class="form-card">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" value="{{email}}" onChange="{{onEmail}}">
    </div>

    <div class="field">
      <div class="pw-row">
        <label for="password">Password</label>
        <button type="button" class="btn-toggle" onClick="{{onTogglePw}}" aria-controls="password">{{pwToggleLabel}}</button>
      </div>
      <input id="password" type="{{pwType}}" autocomplete="current-password" value="{{password}}" onChange="{{onPassword}}">
    </div>

    <p class="help">Resti collegato per 30 giorni su questo telefono. Non hai un account? Chiedilo al tuo tecnico Perleuve.</p>

    <a class="btn-primary" href="Rilievi.dc.html">Accedi</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: '', password: '', showPw: false };
    this.togglePw = this.togglePw.bind(this);
  }

  togglePw() {
    this.setState({ showPw: !this.state.showPw });
  }

  renderVals() {
    const s = this.state;
    return {
      email: s.email,
      onEmail: (e) => this.setState({ email: e.target.value }),
      password: s.password,
      onPassword: (e) => this.setState({ password: e.target.value }),
      pwType: s.showPw ? 'text' : 'password',
      pwToggleLabel: s.showPw ? 'Nascondi' : 'Mostra',
      onTogglePw: this.togglePw
    };
  }
}
</script>
</body>
</html>
